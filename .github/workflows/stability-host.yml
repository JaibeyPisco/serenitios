name: Stability host checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  storage-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs dosfstools mtools qemu-utils
      - name: Check installer and recovery safeguards
        run: |
          python3 Meta/test-install-serenity.py
          python3 Meta/test-recover-serenity-image.py
          python3 Meta/test-recovery-media.py
      - name: Check independent journal reader
        run: python3 Meta/test-jbd2-reader.py
      - name: Check replay against disposable filesystem fixtures
        run: |
          mkdir -p Build
          python3 Meta/test-jbd2-reader-integration.py
          python3 Meta/test-ext3-journal-contract.py
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-replay-evidence
          path: |
            Build/journal-contract-*/results.json
            Build/journal-contract-*/**/*.log
            Build/journal-contract-*/**/result.json
          if-no-files-found: ignore
          retention-days: 14
